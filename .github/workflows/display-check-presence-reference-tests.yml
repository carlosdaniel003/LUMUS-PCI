name: Display CHECK presence reference tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  display-check-presence-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy gpiozero

      - name: Compile presence reference modules
        run: |
          python -m py_compile \
            src/platform/display_check_presence_reference.py \
            src/platform/raspberry_pi3_production_app.py \
            tests/test_display_check_presence_reference.py

      - name: Run presence reference tests
        run: |
          python -m unittest \
            tests.test_display_check_presence_reference \
            -v
