name: Camera stability tests

on:
  push:
    branches:
      - raspberry-pi-3
  workflow_dispatch:

jobs:
  camera-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy gpiozero

      - name: Compile changed camera, display and ROI modules
        run: |
          python -m py_compile \
            src/platform/threaded_camera_service.py \
            src/platform/fixed_full_hd_camera_service.py \
            src/platform/native_resolution_config.py \
            src/platform/led_mask_resolution_sync.py \
            src/platform/fixed_mask_geometry_guard.py \
            src/platform/bulk_roi_editor.py \
            src/platform/area_roi_editor.py \
            src/platform/area_roi_editor_v2.py \
            src/platform/area_roi_editor_v3.py \
            src/platform/area_roi_editor_v4.py \
            src/platform/fullscreen_led_selection.py \
            src/platform/display_awake_runtime.py \
            src/platform/raspberry_pi3_production_app.py \
            src/ui/main_window_parts/lifecycle/init_view.py \
            src/ui/main_window_parts/lifecycle/alternar_tela_cheia.py \
            src/ui/main_window_parts/lifecycle/sair_tela_cheia.py

      - name: Run fixed camera, display and ROI tests
        run: |
          python -m unittest \
            tests.test_native_resolution_camera \
            tests.test_threaded_backend_switch \
            tests.test_linux_camera_backend \
            tests.test_v4l2_controls \
            tests.test_frame_integrity \
            tests.test_camera_stability_runtime \
            tests.test_led_mask_resolution_sync \
            tests.test_display_awake_runtime \
            tests.test_fullscreen_native \
            tests.test_bulk_roi_editor \
            tests.test_area_roi_editor \
            tests.test_area_roi_keyboard \
            tests.test_fixed_mask_geometry_guard \
            tests.test_fullscreen_led_selection \
            -v
