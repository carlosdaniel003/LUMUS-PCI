name: Camera stability tests

on:
  push:
    branches:
      - raspberry-pi-3
  workflow_dispatch:

jobs:
  camera-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy gpiozero

      - name: Compile changed camera modules
        run: |
          python -m py_compile \
            src/platform/camera_performance_profile.py \
            src/platform/native_threaded_camera_service.py \
            src/platform/adaptive_camera_service.py \
            src/platform/native_resolution_config.py \
            src/platform/led_mask_resolution_sync.py \
            src/platform/raspberry_pi3_production_app.py

      - name: Run camera tests
        run: |
          python -m unittest \
            tests.test_camera_performance_profile \
            tests.test_native_resolution_camera \
            tests.test_adaptive_camera_service \
            tests.test_threaded_backend_switch \
            tests.test_linux_camera_backend \
            tests.test_v4l2_controls \
            tests.test_frame_integrity \
            tests.test_camera_stability_runtime \
            tests.test_led_mask_resolution_sync \
            -v
